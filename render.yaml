services:
  - type: web
    name: linguasheet-translation
    runtime: python
    plan: free
    buildCommand: pip install -r backend_requirements.txt && python install_argos_models.py
    startCommand: python install_argos_models.py && python -m uvicorn backend_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
